services:
  web:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  worker:
    build: .
    container_name: celery_worker
    command: celery -A app.celery_worker.celery worker --loglevel=info
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"