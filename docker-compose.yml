services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  worker:
    build: .
    command: celery -A celery_worker.celery worker --loglevel=info
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"